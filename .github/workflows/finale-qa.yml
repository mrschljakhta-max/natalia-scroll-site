name: Cinematic finale WebGL smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  render-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/origami3d.js
          node --check assets/js/cinematic-finale.js
          node --check assets/js/paper-materials.js
          node --check tests/finale-smoke.mjs
      - name: Install Chromium automation
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Serve the GitHub Pages folder
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/natalia-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/ >/dev/null
      - name: Desktop, mobile, reduced-motion and reverse scroll QA
        run: node tests/finale-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finale-qa-screenshots
          path: screenshots/
          if-no-files-found: ignore
