name: Cinematic v37 browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - "cinematic-v37.html"
      - "assets/js/cinematic-v37.js"
      - "assets/images/cinematic-v37-plate.avif"
      - "tests/cinematic-v37-smoke.mjs"
      - ".github/workflows/cinematic-v37-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test kinetic scene desktop, mobile and reduced motion
        run: |
          mkdir -p screenshots
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/cinematic-v37-web.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/cinematic-v37.html >/dev/null; then break; fi
            sleep 1
          done
          CI=1 node tests/cinematic-v37-smoke.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-v37-browser-screens
          path: screenshots/
          if-no-files-found: ignore
