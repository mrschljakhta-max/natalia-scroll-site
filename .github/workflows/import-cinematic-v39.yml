name: Import Runway CGI for Film Lab v39
on:
  push:
    paths:
      - '.github/workflows/import-cinematic-v39.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download and verify the original Runway film
        env:
          RUNWAY_ASSET_URL: 'https://dnznrvs05pmza.cloudfront.net/kling-3-0-pro/943788538137562791/One_uninterrupted_10_second_16_9_ultra_photorealistic_cinematic_CGI_film__Locked_perfectly_FRONTAL_c.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNWIxYzM0NzE0ODZiNTQyZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzIxODI4OX0._OCR5ueP4x_ubbaqMwE4l3TRg3Ao_VEA8ZVbtJE16DQ'
        run: |
          set -euo pipefail
          mkdir -p assets/video
          curl --fail --location --retry 3 --retry-delay 3 --silent --show-error "$RUNWAY_ASSET_URL" -o /tmp/runway-original.mp4
          test "$(stat -c%s /tmp/runway-original.mp4)" -gt 100000
          ffprobe -v error -show_entries stream=codec_type,width,height -of default=nw=1 /tmp/runway-original.mp4
          ffmpeg -hide_banner -loglevel error -y -i /tmp/runway-original.mp4 -an -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -movflags +faststart -r 30 assets/video/waterwheel-runway-source-v39.mp4
          test "$(stat -c%s assets/video/waterwheel-runway-source-v39.mp4)" -gt 100000
          du -h assets/video/waterwheel-runway-source-v39.mp4
      - name: Publish source video into GitHub Pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video/waterwheel-runway-source-v39.mp4
          git commit -m "assets(cinematic): publish source CGI film for wheel editor"
          git push origin HEAD:main
